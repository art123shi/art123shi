<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camper Van Configurator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>Color: <input type="color" id="colorPicker" value="#ff0000"></label>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdddddd);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 2, 5);

    const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas'), antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);

    const controls = new OrbitControls(camera, renderer.domElement);

    // Simple camper van model
    const material = new THREE.MeshStandardMaterial({color: 0xff0000});
    const bodyGeometry = new THREE.BoxGeometry(3, 1, 1.5);
    const body = new THREE.Mesh(bodyGeometry, material);
    scene.add(body);

    const roofGeometry = new THREE.BoxGeometry(2.5, 0.5, 1.4);
    const roof = new THREE.Mesh(roofGeometry, material);
    roof.position.y = 0.75;
    scene.add(roof);

    const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.5, 32);
    const wheelMaterial = new THREE.MeshStandardMaterial({color: 0x333333});
    const wheelPositions = [[1, -0.6, 0.75], [-1, -0.6, 0.75], [1, -0.6, -0.75], [-1, -0.6, -0.75]];
    wheelPositions.forEach(([x, y, z]) => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.position.set(x, y, z);
      wheel.rotation.z = Math.PI / 2;
      scene.add(wheel);
    });

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    const ambient = new THREE.AmbientLight(0x404040);
    scene.add(ambient);

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('colorPicker').addEventListener('input', event => {
      const color = new THREE.Color(event.target.value);
      material.color.set(color);
      roof.material.color.set(color);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
